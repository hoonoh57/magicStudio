name: magicStudio CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Compile Python files
        run: |
          python -m compileall app tools tests

      - name: Run tests
        run: |
          pytest

      - name: Run Phase 1 smoke test
        run: |
          python tools/smoke_phase1.py --workspace .

      - name: Run MVP smoke pipeline
        run: |
          python tools/smoke_mvp.py --workspace .
